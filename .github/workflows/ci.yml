---
name: Lint & Unit

"on":
  pull_request:

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@v0.2.4

  integration-windows:
    name: Windows ${{matrix.suite}} ${{matrix.os}}
    runs-on: windows-latest
    needs: lint-unit
    strategy:
      fail-fast: false
      matrix:
        suite: [default]
        os: [ubuntu-20.04]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: bundle exec kitchen test ${{ matrix.suite }}-${{ matrix.os }}

  integration-linux:
    name: Linux ${{matrix.suite}} ${{matrix.os}}
    runs-on: ubuntu-latest
    needs: lint-unit
    strategy:
      fail-fast: false
      matrix:
        suite:
          - default
          - no-build-context
          - arm64
          - amd64
          - inspec
        os:
          - amazonlinux-2
          - ubuntu-2004
          - ubuntu-2204
          - ubuntu-2404
          - fedora-latest
          - centos-stream-9
          - oraclelinux-7
          - oraclelinux-8
          - oraclelinux-9
          - rockylinux-9
          - debian-12
          - opensuse-15
          - dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: bundle exec kitchen test ${{ matrix.suite }}-${{ matrix.os }}

  integration-capabilities:
    name: Linux ${{matrix.suite}} ${{matrix.os}}
    runs-on: ubuntu-latest
    needs: lint-unit
    strategy:
      fail-fast: false
      matrix:
        suite:
          - capabilities
        os: [ubuntu-2004, ubuntu-2204, ubuntu-2404]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: bundle exec kitchen test ${{ matrix.suite }}-${{ matrix.os }}
