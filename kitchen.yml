---
driver:
  name: docker
  provision_command: curl -L https://omnitruck.cinc.sh/install.sh | bash

transport:
  name: docker

provisioner:
  name: cinc_infra
  install_strategy: skip

verifier:
  name: cinc_auditor

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: ubuntu-22.04
  - name: ubuntu-24.04
  - name: ubuntu-26.04
  - name: fedora-latest
  - name: centos-stream-9
    driver:
      image: dokken/centos-stream-9
  - name: centos-stream-10
    driver:
      image: dokken/centos-stream-10
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: oraclelinux-10
  - name: rockylinux-8
  - name: rockylinux-9
  - name: rockylinux-10
    driver:
      image: dokken/rockylinux-10
  - name: debian-13
  - name: opensuse-16
    driver:
      image: opensuse/leap:16
  - name: dockerfile
    driver:
      username: dockerfile
      password: dockerfile
      dockerfile: test/Dockerfile
  - name: windows-2022
    driver:
      image: mcr.microsoft.com/windows/servercore:ltsc2022
      provision_command:
        - powershell -Command "Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12; iex ((New-Object System.Net.WebClient).DownloadString('https://omnitruck.cinc.sh/install.ps1')); Install-Project -Project cinc -Channel stable"
    provisioner:
      cinc_omnibus_root: 'C:\cinc-project\cinc'

suites:
  - name: default
    run_list:
      - recipe[cinc_test::default]
    verifier:
      inspec_tests:
        - test/integration/cinc/inspec
  - name: docker-test
    run_list:
      - recipe[docker_test::default]
    attributes:
      docker_test:
        revision: <%= `git rev-parse HEAD` %>
  - name: no_build_context
    run_list:
      - recipe[cinc_test::default]
    driver:
      build_context: false
  - name: capabilities
    run_list:
      - recipe[cinc_test::default]
    driver:
      cap_drop:
        - NET_ADMIN
  - name: arm64
    run_list:
      - recipe[cinc_test::default]
    driver:
      docker_platform: linux/arm64
  - name: amd64
    run_list:
      - recipe[cinc_test::default]
    driver:
      docker_platform: linux/amd64
  - name: inspec
    run_list:
      - recipe[cinc_test::default]
