# <% # Make sure the local copy of the driver is loaded %>
# <% lib = File.expand_path('../lib', __FILE__) %>
# <% $LOAD_PATH.unshift(lib) unless $LOAD_PATH.include?(lib) %>
---
driver:
  name: docker

transport:
  name: docker

provisioner:
  name: cinc_infra

verifier:
  name: cinc_auditor

platforms:
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: ubuntu-22.04
  - name: ubuntu-24.04
  - name: ubuntu-26.04
  - name: fedora-latest
    driver:
      provision_command:
        - yum install libxcrypt-compat -y
        - curl -L https://www.chef.io/chef/install.sh | bash
  - name: centos-stream-9
    driver:
      image: dokken/centos-stream-9
  - name: centos-stream-10
    driver:
      image: dokken/centos-stream-10
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: oraclelinux-10
  - name: rockylinux-9
  - name: rockylinux-10
  - name: debian-13
  - name: opensuse-16
    driver:
      image: opensuse/leap:16
  - name: dockerfile
    driver:
      username: dockerfile
      password: dockerfile
      dockerfile: test/Dockerfile
      run_command: /sbin/init

suites:
  - name: default
  - name: no_build_context
    driver:
      build_context: false
  - name: capabilities
    includes: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    driver:
      provision_command:
        - curl -L https://www.chef.io/chef/install.sh | bash
        - apt-get install -y net-tools
      cap_drop:
        - NET_ADMIN
  - name: arm64
    driver:
      docker_platform: linux/arm64
  - name: amd64
    driver:
      docker_platform: linux/amd64
  - name: inspec
    driver:
      provision_command: true
    verifier:
      name: inspec
